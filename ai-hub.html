<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Hub — راهنمای جامع هوش مصنوعی | ErPyCode</title>
  <meta name="description" content="راهنمای جامع بهترین ابزارهای هوش مصنوعی برای کدنویسی، طراحی، ویدیو، صدا و بیشتر">
  <meta name="author" content="ErPyCode">
  <meta property="og:title" content="AI Hub — راهنمای جامع هوش مصنوعی">
  <meta property="og:description" content="بهترین ابزارهای AI رو برای کارت پیدا کن">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-deep: #0a0a0b;
      --bg-panel: #111113;
      --bg-surface: #1a1a1e;
      --bg-elevated: #222226;
      --bg-hover: #2a2a2e;
      --text-primary: #f0f0f2;
      --text-secondary: #b0b4bc;
      --text-muted: #6a6e78;
      --text-dim: #4a4e58;
      --brand: #DC2626;
      --brand-light: #ef4444;
      --brand-dark: #991b1b;
      --brand-glow: rgba(220, 38, 38, 0.12);
      --brand-glow-strong: rgba(220, 38, 38, 0.25);
      --border: rgba(255,255,255,0.06);
      --border-light: rgba(255,255,255,0.10);
      --glass: rgba(255,255,255,0.03);
      --glass-hover: rgba(255,255,255,0.06);
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --radius-xl: 24px;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
      --shadow-lg: 0 8px 32px rgba(0,0,0,0.5);
      --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Vazirmatn', 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg-deep);
      color: var(--text-primary);
      line-height: 1.7;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ─── HEADER ─── */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10,10,11,0.88);
      backdrop-filter: blur(24px) saturate(1.3);
      -webkit-backdrop-filter: blur(24px) saturate(1.3);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
    }
    .header-inner {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text-primary);
    }
    .logo-icon {
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, var(--brand), var(--brand-light));
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 700;
      color: white;
      letter-spacing: -0.5px;
    }
    .logo-text {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .nav-links {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .nav-link {
      padding: 7px 14px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 500;
      color: var(--text-secondary);
      text-decoration: none;
      cursor: pointer;
      transition: all var(--transition);
      border: none;
      background: none;
      font-family: inherit;
    }
    .nav-link:hover, .nav-link.active {
      color: var(--text-primary);
      background: var(--glass-hover);
    }
    .nav-link.active {
      color: var(--brand-light);
    }
    .hamburger {
      display: none;
      background: none;
      border: none;
      color: var(--text-primary);
      font-size: 24px;
      cursor: pointer;
      padding: 8px;
    }

    /* ─── SEARCH ─── */
    .search-section {
      max-width: 1280px;
      margin: 0 auto;
      padding: 20px 24px 0;
    }
    .search-bar {
      position: relative;
      max-width: 560px;
      margin: 0 auto;
    }
    .search-bar input {
      width: 100%;
      padding: 13px 20px 13px 48px;
      background: var(--bg-surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: all var(--transition);
    }
    .search-bar input::placeholder { color: var(--text-muted); }
    .search-bar input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px var(--brand-glow);
    }
    .search-icon {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 16px;
      pointer-events: none;
    }

    /* ─── WIZARD ─── */
    .wizard-section {
      max-width: 1280px;
      margin: 0 auto;
      padding: 36px 24px;
    }
    .wizard-container {
      background: linear-gradient(160deg, var(--bg-panel) 0%, var(--bg-surface) 100%);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 36px;
      position: relative;
      overflow: hidden;
    }
    .wizard-container::before {
      content: '';
      position: absolute;
      top: -80px;
      right: -80px;
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, var(--brand-glow-strong), transparent 70%);
      pointer-events: none;
    }
    .wizard-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
      position: relative;
    }
    .wizard-subtitle {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 28px;
      position: relative;
    }
    .wizard-steps {
      display: flex;
      gap: 20px;
      margin-bottom: 24px;
      position: relative;
    }
    .wizard-step {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .step-num {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--glass);
      border: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      transition: all var(--transition);
      flex-shrink: 0;
    }
    .step-num.active {
      background: var(--brand);
      border-color: var(--brand);
      color: white;
    }
    .step-num.done {
      background: #16a34a;
      border-color: #16a34a;
      color: white;
    }
    .step-label {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
      white-space: nowrap;
    }
    .step-label.active { color: var(--text-primary); }

    .wizard-options {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      position: relative;
    }
    .wizard-option {
      padding: 10px 20px;
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition);
      font-family: inherit;
    }
    .wizard-option:hover {
      border-color: var(--brand);
      color: var(--text-primary);
      background: var(--brand-glow);
    }
    .wizard-option.selected {
      border-color: var(--brand);
      background: var(--brand);
      color: white;
    }
    .wizard-result {
      display: none;
      margin-top: 24px;
      position: relative;
    }
    .wizard-result.show { display: block; }
    .wizard-result h3 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 14px;
      color: var(--brand-light);
    }
    .recommendation-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }
    .rec-card {
      padding: 18px;
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      transition: all var(--transition);
    }
    .rec-card:hover {
      border-color: var(--brand);
      transform: translateY(-2px);
      box-shadow: 0 4px 20px var(--brand-glow);
    }
    .rec-card-name {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .rec-card-desc {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 10px;
      line-height: 1.6;
    }
    .rec-card-link {
      display: inline-block;
      padding: 5px 14px;
      background: var(--brand);
      color: white;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      transition: all var(--transition);
    }
    .rec-card-link:hover { background: var(--brand-light); }

    /* ─── CATEGORIES ─── */
    .categories-section {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 24px 40px;
    }
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .section-title {
      font-size: 20px;
      font-weight: 700;
    }
    .section-badge {
      padding: 4px 12px;
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }
    .category-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
    }
    .category-card {
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 26px;
      cursor: pointer;
      transition: all var(--transition);
      position: relative;
      overflow: hidden;
    }
    .category-card:hover {
      border-color: var(--brand);
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg), 0 0 40px var(--brand-glow);
    }
    .category-emoji {
      font-size: 34px;
      margin-bottom: 14px;
      display: block;
    }
    .category-name {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .category-desc {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.7;
      margin-bottom: 14px;
    }
    .category-tools {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .tool-tag {
      padding: 3px 10px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      font-size: 11px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    /* ─── TOOLS OVERLAY ─── */
    .tools-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(0,0,0,0.72);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .tools-overlay.show { display: flex; }
    .tools-panel {
      width: 100%;
      max-width: 880px;
      max-height: 85vh;
      background: var(--bg-panel);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .tools-panel-header {
      flex-shrink: 0;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .tools-panel-title {
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .tools-panel-close {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--glass);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition);
    }
    .tools-panel-close:hover {
      background: var(--brand);
      border-color: var(--brand);
      color: white;
    }
    .tools-panel-body {
      padding: 20px 24px;
      overflow-y: auto;
      flex: 1;
    }
    .filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .filter-btn {
      padding: 5px 14px;
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition);
      font-family: inherit;
      font-weight: 500;
    }
    .filter-btn:hover, .filter-btn.active {
      border-color: var(--brand);
      color: white;
      background: var(--brand);
    }
    .tool-card {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 14px;
      align-items: center;
      padding: 16px;
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      margin-bottom: 8px;
      transition: all var(--transition);
    }
    .tool-card:hover {
      border-color: rgba(220,38,38,0.3);
      background: var(--glass-hover);
    }
    .tool-icon {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-md);
      background: var(--bg-surface);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .tool-info h4 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 2px;
    }
    .tool-info p {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
    }
    .tool-meta {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }
    .tool-badge {
      padding: 3px 8px;
      border-radius: var(--radius-sm);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }
    .badge-free { background: rgba(34,197,94,0.15); color: #4ade80; }
    .badge-paid { background: rgba(220,38,38,0.15); color: #f87171; }
    .badge-freemium { background: rgba(234,179,8,0.15); color: #facc15; }
    .badge-beginner { background: rgba(59,130,246,0.15); color: #60a5fa; }
    .badge-pro { background: rgba(168,85,247,0.15); color: #c084fc; }
    .tool-visit {
      padding: 7px 16px;
      background: var(--brand);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all var(--transition);
      white-space: nowrap;
      font-family: inherit;
    }
    .tool-visit:hover {
      background: var(--brand-light);
      transform: translateY(-1px);
    }

    /* ─── COMPARE ─── */
    .compare-section {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 24px 40px;
    }
    .compare-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .compare-slot {
      background: var(--glass);
      border: 2px dashed var(--border-light);
      border-radius: var(--radius-lg);
      padding: 28px;
      min-height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--text-muted);
      transition: all var(--transition);
    }
    .compare-slot.filled {
      border-style: solid;
      border-color: var(--brand);
      align-items: flex-start;
      text-align: right;
      flex-direction: column;
    }
    .compare-placeholder {
      font-size: 14px;
      line-height: 1.7;
    }
    .compare-placeholder span {
      display: block;
      font-size: 32px;
      margin-bottom: 8px;
    }
    .compare-content h4 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .compare-content p {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 12px;
      line-height: 1.7;
    }
    .compare-list {
      list-style: none;
    }
    .compare-list li {
      padding: 4px 0;
      font-size: 13px;
      color: var(--text-secondary);
    }
    .compare-list li::before {
      content: '✓ ';
      color: var(--brand-light);
      font-weight: 700;
    }
    .vs-divider {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 48px;
      height: 48px;
      background: var(--brand);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      color: white;
      z-index: 10;
    }
    .compare-wrapper {
      position: relative;
    }

    /* ─── STATS ─── */
    .stats-bar {
      max-width: 1280px;
      margin: 0 auto;
      padding: 32px 24px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }
    .stat-card {
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 20px;
      text-align: center;
    }
    .stat-number {
      font-size: 30px;
      font-weight: 700;
      color: var(--brand-light);
      margin-bottom: 2px;
    }
    .stat-label {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* ─── FOOTER ─── */
    .footer {
      border-top: 1px solid var(--border);
      padding: 28px 24px;
      text-align: center;
    }
    .footer-text {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.8;
    }
    .footer-brand {
      color: var(--brand-light);
      font-weight: 700;
      text-decoration: none;
    }
    .footer-brand:hover { text-decoration: underline; }
    .footer-heart { color: var(--brand); }
    .footer-links {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 10px;
    }
    .footer-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 13px;
      transition: color var(--transition);
    }
    .footer-links a:hover { color: var(--brand-light); }

    /* ─── ANIMATIONS ─── */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-in {
      animation: fadeInUp 0.45s ease-out forwards;
      opacity: 0;
    }
    .animate-in:nth-child(1) { animation-delay: 0.04s; }
    .animate-in:nth-child(2) { animation-delay: 0.08s; }
    .animate-in:nth-child(3) { animation-delay: 0.12s; }
    .animate-in:nth-child(4) { animation-delay: 0.16s; }
    .animate-in:nth-child(5) { animation-delay: 0.20s; }
    .animate-in:nth-child(6) { animation-delay: 0.24s; }
    .animate-in:nth-child(7) { animation-delay: 0.28s; }
    .animate-in:nth-child(8) { animation-delay: 0.32s; }

    /* ─── SCROLLBAR ─── */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 768px) {
      .nav-links { display: none; }
      .hamburger { display: block; }
      .nav-links.open {
        display: flex;
        flex-direction: column;
        position: absolute;
        top: 64px;
        right: 0;
        left: 0;
        background: var(--bg-panel);
        border-bottom: 1px solid var(--border);
        padding: 12px;
        gap: 4px;
      }
      .wizard-container { padding: 22px; }
      .wizard-steps { flex-direction: column; gap: 10px; }
      .compare-grid { grid-template-columns: 1fr; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .category-grid { grid-template-columns: 1fr; }
      .tool-card { grid-template-columns: auto 1fr; }
      .tool-meta { grid-column: 1 / -1; margin-top: 4px; }
      .compare-tray { flex-wrap: wrap; }
      .compare-tray-items { gap: 8px; }
      .tray-item { min-width: 120px; }
      .compare-modal { padding: 16px; }
      .compare-modal-grid { grid-template-columns: 1fr; }
      .compare-header-cards { grid-template-columns: 1fr; gap: 12px; }
      .rating-bars { gap: 12px; }
      .bar-group { flex-direction: column; align-items: flex-start; gap: 6px; }
      .bar-label { width: 100px; flex-shrink: 0; }
      .bar-track { width: 100%; }
    }

    /* ─── COMPARE TRAY (Bottom Sticky) ─── */
    .compare-tray {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 150;
      background: rgba(17,17,19,0.95);

      justify-content: center;

      align-items: center;
      justify-content: space-between;
      z-index: 10;

      font-weight: 700;

      align-items: center;

      display: flex;
      align-items: center;
      justify-content: center;

      grid-template-columns: 1fr auto 1fr;
      gap: 16px;
      margin-bottom: 32px;
      align-items: center;

      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      text-align: center;

      font-size: 42px;
      margin-bottom: 10px;
      display: block;

    .compare-tool-name {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .compare-tool-desc {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 14px;
      line-height: 1.6;

      gap: 6px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 14px;

      display: inline-block;
      padding: 6px 16px;
      background: var(--brand);
      color: white;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      transition: all var(--transition);

      height: 52px;

      height: 100px;
      position: relative;

    .score-circle svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }
    .score-circle-bg {
      fill: none;
      stroke: var(--border-light);
      stroke-width: 6;
    }
    .score-circle-fill {
      fill: none;
      stroke: var(--brand);
      stroke-width: 6;
      stroke-linecap: round;
      stroke-dasharray: 283;
      stroke-dashoffset: 283;
      transition: stroke-dashoffset 1.2s cubic-bezier(0.4, 0, 0.2, 1);

    .score-circle-fill.winner {
      stroke: var(--brand-light);
      filter: drop-shadow(0 0 8px var(--brand-glow-strong));

      inset: 0;

      gap: 12px;

      width: 110px;
      font-size: 13px;
      color: var(--text-secondary);

      text-align: left;
      flex-shrink: 0;

    .features-col-title {

      font-weight: 700;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;

      list-style: none;

    .features-list li {
      padding: 5px 0;
      font-size: 13px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

      content: '✓';
      color: #4ade80;
      font-weight: 700;
      font-size: 12px;
    }

    /* ─── WINNER BANNER ─── */
    .winner-banner {
      margin-top: 24px;
      padding: 16px 24px;

      border-radius: var(--radius-md);
      text-align: center;
      animation: glowPulse 2s ease-in-out infinite;
    }
    .winner-banner-text {
      font-size: 16px;
      font-weight: 700;
      color: var(--brand-light);
    }
    .winner-banner-sub {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* ─── TOAST NOTIFICATION ─── */
    .toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--bg-elevated);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
      z-index: 250;
      opacity: 0;
      transition: all 0.3s ease;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: var(--shadow-lg);
      white-space: nowrap;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .toast-icon { font-size: 16px; }

    /* ─── TOOLTIP ─── */
    .tooltip-wrapper {
      position: relative;
    }
    .tooltip-wrapper::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%) translateY(4px);
      background: var(--bg-elevated);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-secondary);
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s ease;
      z-index: 50;
    }
    .tooltip-wrapper:hover::after {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ─── KEYFRAMES ─── */
    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }

      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }

      50% { box-shadow: 0 0 40px var(--brand-glow-strong); }

// ═══════════════════════════════════════════
//  WIZARD STATE
// ═══════════════════════════════════════════
let wizardState = { step: 1, task: null, level: null, budget: null };

function renderWizardOptions() {
  const container = document.getElementById('wizardOptions');
  const result = document.getElementById('wizardResult');
  result.classList.remove('show');

  let items = [];
  if (wizardState.step === 1) items = wizardData.tasks;
  else if (wizardState.step === 2) items = wizardData.levels;
  else if (wizardState.step === 3) items = wizardData.budgets;

  container.innerHTML = items.map(item =>
    `<button class="wizard-option" onclick="wizardSelect(${wizardState.step}, '${item.id}', '${item.category || ''}')">${item.label}</button>`
  ).join('');

  updateStepIndicators();
}

function wizardSelect(step, id, category) {
  if (step === 1) { wizardState.task = id; wizardState.category = category; wizardState.step = 2; }
  else if (step === 2) { wizardState.level = id; wizardState.step = 3; }
  else if (step === 3) {
    wizardState.budget = id;
    showRecommendations();
    return;
  }
  renderWizardOptions();
}

function updateStepIndicators() {
  for (let i = 1; i <= 3; i++) {
    const num = document.getElementById(`step${i}Num`);
    const label = document.getElementById(`step${i}Label`);
    num.className = 'step-num';
    label.className = 'step-label';
    if (i < wizardState.step) { num.className = 'step-num done'; num.textContent = '✓'; }
    else if (i === wizardState.step) { num.className = 'step-num active'; label.className = 'step-label active'; }
  }
}

function showRecommendations() {
  const cat = categories.find(c => c.id === wizardState.category);
  if (!cat) return;

  let filtered = cat.tools.filter(t => {
    if (wizardState.level !== 'any' && t.level !== wizardState.level && t.level !== 'beginner') return false;
    if (wizardState.budget === 'free' && t.pricing === 'paid') return false;
    return true;
  });

  if (filtered.length === 0) filtered = cat.tools.slice(0, 3);

  const container = document.getElementById('recommendationCards');
  container.innerHTML = filtered.slice(0, 3).map(tool => `
    <div class="rec-card">
      <div class="rec-card-name">${tool.icon} ${tool.name}</div>
      <div class="rec-card-desc">${tool.desc}</div>
      <a href="${tool.url}" target="_blank" class="rec-card-link">مشاهده →</a>
    </div>
  `).join('');

  document.getElementById('wizardResult').classList.add('show');
  document.getElementById('step3Num').className = 'step-num done';
  document.getElementById('step3Num').textContent = '✓';
}

//  CATEGORIES
// ═══════════════════════════════════════════
function renderCategories() {
  const grid = document.getElementById('categoryGrid');
  grid.innerHTML = categories.map((cat, i) => `
    <div class="category-card animate-in" onclick="openCategory('${cat.id}')" style="animation-delay: ${i * 0.05}s">
      <span class="category-emoji">${cat.emoji}</span>
      <div class="category-name">${cat.name}</div>
      <div class="category-desc">${cat.desc}</div>
      <div class="category-tools">
        ${cat.tools.slice(0, 4).map(t => `<span class="tool-tag">${t.name}</span>`).join('')}
        ${cat.tools.length > 4 ? `<span class="tool-tag">+${cat.tools.length - 4}</span>` : ''}
      </div>
    </div>
  `).join('');

  const totalTools = categories.reduce((sum, c) => sum + c.tools.length, 0);
  const freeTools = categories.reduce((sum, c) => sum + c.tools.filter(t => t.pricing === 'free' || t.pricing === 'freemium').length, 0);
  document.getElementById('statTools').textContent = totalTools;
  document.getElementById('statFree').textContent = freeTools;
}

function openCategory(catId) {
  const cat = categories.find(c => c.id === catId);
  if (!cat) return;

  document.getElementById('toolsPanelTitle').innerHTML = `${cat.emoji} ${cat.name}`;

  const filterBar = document.getElementById('filterBar');
  filterBar.innerHTML = `
    <button class="filter-btn active" onclick="filterTools('all', this)">همه</button>
    <button class="filter-btn" onclick="filterTools('free', this)">رایگان</button>
    <button class="filter-btn" onclick="filterTools('paid', this)">پولی</button>
    <button class="filter-btn" onclick="filterTools('beginner', this)">مبتدی</button>
    <button class="filter-btn" onclick="filterTools('pro', this)">حرفه‌ای</button>
  `;

  renderToolsList(cat.tools, 'all');
  document.getElementById('toolsOverlay').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function renderToolsList(tools, filter) {
  let filtered = tools;
  if (filter === 'free') filtered = tools.filter(t => t.pricing === 'free' || t.pricing === 'freemium');
  else if (filter === 'paid') filtered = tools.filter(t => t.pricing === 'paid');
  else if (filter === 'beginner') filtered = tools.filter(t => t.level === 'beginner');
  else if (filter === 'pro') filtered = tools.filter(t => t.level === 'pro');
  document.getElementById('toolsList').innerHTML = filtered.map(tool => {
    const isInCompare = compareList.some(c => c.name === tool.name);
    return `
      <div class="tool-card">
        <div class="tool-icon">${tool.icon}</div>
        <div class="tool-info">
          <h4>${tool.name}</h4>
          <p>${tool.desc}</p>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;">
          <div class="tool-meta">
            <span class="tool-badge badge-${tool.pricing}">${tool.pricing === 'free' ? 'رایگان' : tool.pricing === 'freemium' ? 'freemium' : 'پولی'}</span>
            <span class="tool-badge badge-${tool.level}">${tool.level === 'beginner' ? 'مبتدی' : 'حرفه‌ای'}</span>
          </div>
          <div style="display:flex;gap:8px;align-items:center;">
            <div class="tooltip-wrapper" data-tooltip="${isInCompare ? 'حذف از مقایسه' : 'افزودن به مقایسه'}">
              <button class="tool-compare-btn ${isInCompare ? 'added' : ''}" onclick="event.stopPropagation();toggleCompare('${tool.name}','${tool.icon}','${tool.desc}','${tool.url}')">⚖️</button>
            </div>
            <a href="${tool.url}" target="_blank" class="tool-visit">مشاهده →</a>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function filterTools(filter, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  const catId = document.getElementById('toolsPanelTitle').textContent.trim();
  const cat = categories.find(c => catId.includes(c.name));
  if (cat) renderToolsList(cat.tools, filter);
}

function closeTools(e) {
  if (e && e.target !== document.getElementById('toolsOverlay')) return;
  document.getElementById('toolsOverlay').classList.remove('show');
  document.body.style.overflow = '';
}

// ═══════════════════════════════════════════
//  SEARCH
// ═══════════════════════════════════════════
function handleSearch(query) {
  if (!query.trim()) { renderCategories(); return; }
  const q = query.toLowerCase();
  const grid = document.getElementById('categoryGrid');

  const matched = categories.filter(c =>
    c.name.includes(q) || c.desc.includes(q) ||
    c.tools.some(t => t.name.toLowerCase().includes(q) || t.desc.includes(q))
  );

  if (matched.length === 0) {
    grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--text-muted);">
      <div style="font-size:48px;margin-bottom:16px;">🔍</div>
      <div style="font-size:16px;">نتیجه‌ای برای "${query}" پیدا نشد</div>
    </div>`;
    return;
  }

  grid.innerHTML = matched.map((cat, i) => `
    <div class="category-card animate-in" onclick="openCategory('${cat.id}')" style="animation-delay: ${i * 0.05}s">
      <span class="category-emoji">${cat.emoji}</span>
      <div class="category-name">${cat.name}</div>
      <div class="category-desc">${cat.desc}</div>
      <div class="category-tools">
        ${cat.tools.slice(0, 4).map(t => `<span class="tool-tag">${t.name}</span>`).join('')}
      </div>
    </div>
  `).join('');
}

// ═══════════════════════════════════════════
//  COMPARE SYSTEM
// ═══════════════════════════════════════════
let compareList = []; // max 2 items

// Toast notification
let toastTimeout = null;
function showToast(icon, text) {
  const toast = document.getElementById('toast');
  const toastIcon = document.getElementById('toastIcon');
  const toastText = document.getElementById('toastText');
  toastIcon.textContent = icon;
  toastText.textContent = text;
  toast.classList.add('show');
  if (toastTimeout) clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => toast.classList.remove('show'), 2200);
}

function toggleCompare(name, icon, desc, url) {
  const idx = compareList.findIndex(c => c.name === name);
  if (idx > -1) {
    compareList.splice(idx, 1);
    showToast('🗑️', `${name} از مقایسه حذف شد`);
  } else {
    if (compareList.length >= 2) {
      compareList.shift(); // remove first if full
      showToast('🔄', `${compareList[0]?.name || name} جایگزین شد`);
    }
    compareList.push({ name, icon, desc, url });
    if (compareList.length <= 2) {
      showToast('✅', `${name} به مقایسه اضافه شد — ${compareList.length}/2`);
    }
  }
  renderCompareTray();
  // re-render current tools list to update button states
  const catTitle = document.getElementById('toolsPanelTitle')?.textContent || '';
  const cat = categories.find(c => catTitle.includes(c.name));
  if (cat) {
    const activeFilter = document.querySelector('.filter-btn.active')?.textContent || 'همه';
    const filterMap = {'همه':'all','رایگان':'free','پولی':'paid','مبتدی':'beginner','حرفه‌ای':'pro'};
    renderToolsList(cat.tools, filterMap[activeFilter] || 'all');
  }
}

function renderCompareTray() {
  const tray = document.getElementById('compareTray');
  const items = document.getElementById('compareTrayItems');
  const goBtn = document.getElementById('compareGoBtn');

  if (compareList.length === 0) {
    tray.classList.remove('show');
    return;
  }

  tray.classList.add('show');
  let html = '';
  compareList.forEach((item, i) => {
    html += `
      <div class="tray-item">
        <span class="tray-item-icon">${item.icon}</span>
        <span class="tray-item-name">${item.name}</span>
        <button class="tray-item-remove" onclick="removeFromCompare(${i})">✕</button>
      </div>`;
  });
  if (compareList.length < 2) {
    html += `<div class="tray-slot-empty">+ ابزار دوم</div>`;
  }
  items.innerHTML = html;
  goBtn.disabled = compareList.length < 2;
}

function removeFromCompare(idx) {
  compareList.splice(idx, 1);
  renderCompareTray();
  // re-render tools list
  const catTitle = document.getElementById('toolsPanelTitle')?.textContent || '';
  const cat = categories.find(c => catTitle.includes(c.name));
  if (cat) {
    const activeFilter = document.querySelector('.filter-btn.active')?.textContent || 'همه';
    const filterMap = {'همه':'all','رایگان':'free','پولی':'paid','مبتدی':'beginner','حرفه‌ای':'pro'};
    renderToolsList(cat.tools, filterMap[activeFilter] || 'all');
  }
}

function clearCompare() {
  compareList = [];
  renderCompareTray();
  const catTitle = document.getElementById('toolsPanelTitle')?.textContent || '';
  const cat = categories.find(c => catTitle.includes(c.name));
  if (cat) {
    const activeFilter = document.querySelector('.filter-btn.active')?.textContent || 'همه';
    const filterMap = {'همه':'all','رایگان':'free','پولی':'paid','مبتدی':'beginner','حرفه‌ای':'pro'};
    renderToolsList(cat.tools, filterMap[activeFilter] || 'all');
  }
}

function openCompareModal() {
  if (compareList.length < 2) return;
  const [a, b] = compareList;
  const ra = defaultRatings[a.name] || [7,7,7,7,7];
  const rb = defaultRatings[b.name] || [7,7,7,7,7];
  const scoreA = Math.round(ra.reduce((s,v)=>s+v,0) / ra.length * 10);
  const scoreB = Math.round(rb.reduce((s,v)=>s+v,0) / rb.length * 10);
  const winner = scoreA >= scoreB ? 'a' : 'b';

  const pricingLabel = (t) => t === 'free' ? 'رایگان' : t === 'freemium' ? 'Freemium' : 'پولی';

  const body = document.getElementById('compareModalBody');
  body.innerHTML = `
    <!-- Tool Cards -->
    <div class="compare-header-cards">
      <div class="compare-tool-card ${winner === 'a' ? 'winner' : ''}">
        <span class="compare-tool-icon">${a.icon}</span>
        <div class="compare-tool-name">${a.name}</div>
        <div class="compare-tool-desc">${a.desc}</div>
        <div class="compare-tool-badges">
          <span class="tool-badge badge-free">رایگان</span>
        </div>
        <a href="${a.url}" target="_blank" class="compare-tool-link">مشاهده →</a>
      </div>
      <div class="compare-vs">VS</div>
      <div class="compare-tool-card ${winner === 'b' ? 'winner' : ''}">
        <span class="compare-tool-icon">${b.icon}</span>
        <div class="compare-tool-name">${b.name}</div>
        <div class="compare-tool-desc">${b.desc}</div>
        <div class="compare-tool-badges">
          <span class="tool-badge badge-free">رایگان</span>
        </div>
        <a href="${b.url}" target="_blank" class="compare-tool-link">مشاهده →</a>
      </div>
    </div>

    <!-- Score Circles -->
    <div class="score-section">
      <div class="score-circle-wrapper">
        <div class="score-circle">
          <svg viewBox="0 0 100 100">
            <circle class="score-circle-bg" cx="50" cy="50" r="45"/>
            <circle class="score-circle-fill ${winner === 'a' ? 'winner' : ''}" cx="50" cy="50" r="45" id="scoreCircleA"/>
          </svg>
          <div class="score-number" id="scoreNumA">0</div>
        </div>
        <div class="score-label">${a.name}</div>
      </div>
      <div class="score-vs-label">امتیاز کل</div>
      <div class="score-circle-wrapper">
        <div class="score-circle">
          <svg viewBox="0 0 100 100">
            <circle class="score-circle-bg" cx="50" cy="50" r="45"/>
            <circle class="score-circle-fill ${winner === 'b' ? 'winner' : ''}" cx="50" cy="50" r="45" id="scoreCircleB"/>
          </svg>
          <div class="score-number" id="scoreNumB">0</div>
        </div>
        <div class="score-label">${b.name}</div>
      </div>
    </div>

    <!-- Rating Bars -->
    <div class="rating-bars" id="ratingBars">
      ${ratingLabels.map((label, i) => `
        <div class="bar-group">
          <div class="bar-label">${label}</div>
          <div class="bar-tracks">
            <div class="bar-track"><div class="bar-fill tool-a" id="barA${i}"></div></div>
            <div class="bar-track"><div class="bar-fill tool-b" id="barB${i}"></div></div>
          </div>
          <div class="bar-values">
            <span class="bar-value tool-a" id="barVA${i}">0</span>
            <span class="bar-value tool-b" id="barVB${i}">0</span>
          </div>
        </div>
      `).join('')}
    </div>

    <!-- Features -->
    <div class="features-comparison">
      <div class="features-title">✨ ویژگی‌ها</div>
      <div class="features-grid">
        <div class="features-col">
          <div class="features-col-title">${a.icon} ${a.name}</div>
          <ul class="features-list" id="featuresA"></ul>
        </div>
        <div class="features-col">
          <div class="features-col-title">${b.icon} ${b.name}</div>
          <ul class="features-list" id="featuresB"></ul>
        </div>
      </div>
    </div>

    <!-- Winner Banner -->
    <div class="winner-banner" id="winnerBanner">
      <div class="winner-banner-text">🏆 برنده: ${winner === 'a' ? a.name : b.name}</div>
      <div class="winner-banner-sub">بر اساس امتیاز کل ${Math.max(scoreA, scoreB)} از ۱۰۰</div>
    </div>
  `;

  document.getElementById('compareModalOverlay').classList.add('show');
  document.body.style.overflow = 'hidden';

  // Populate features
  const catA = categories.find(c => c.tools.some(t => t.name === a.name));
  const catB = categories.find(c => c.tools.some(t => t.name === b.name));
  const toolA = catA?.tools.find(t => t.name === a.name);
  const toolB = catB?.tools.find(t => t.name === b.name);
  if (toolA) document.getElementById('featuresA').innerHTML = toolA.features.map(f => `<li>${f}</li>`).join('');
  if (toolB) document.getElementById('featuresB').innerHTML = toolB.features.map(f => `<li>${f}</li>`).join('');

  // Animate after small delay
  setTimeout(() => {
    // Score circles
    const circumference = 283;
    document.getElementById('scoreCircleA').style.strokeDashoffset = circumference - (circumference * scoreA / 100);
    document.getElementById('scoreCircleB').style.strokeDashoffset = circumference - (circumference * scoreB / 100);
    animateNumber('scoreNumA', scoreA);
    animateNumber('scoreNumB', scoreB);

    // Rating bars
    ra.forEach((v, i) => {
      document.getElementById('barA' + i).style.width = (v * 10) + '%';
      document.getElementById('barB' + i).style.width = (rb[i] * 10) + '%';
      animateNumber('barVA' + i, v);
      animateNumber('barVB' + i, rb[i]);
    });
  }, 100);
}

function animateNumber(id, target) {
  const el = document.getElementById(id);
  if (!el) return;
  let current = 0;
  const step = Math.max(1, Math.floor(target / 20));
  const interval = setInterval(() => {
    current += step;
    if (current >= target) { current = target; clearInterval(interval); }
    el.textContent = current;
  }, 30);
}

function closeCompareModal(e) {
  if (e && e.target !== document.getElementById('compareModalOverlay')) return;
  document.getElementById('compareModalOverlay').classList.remove('show');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeTools();
    closeCompareModal();
  }
});
